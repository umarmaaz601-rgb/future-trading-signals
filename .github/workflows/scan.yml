name: 24/7 scanner

# Runs the full checklist scan every 5 minutes on GitHub's servers,
# sends Telegram alerts, refreshes dashboard/data.json and redeploys
# the mobile dashboard (GitHub Pages) with the fresh data - so the
# phone app's notification poller sees new signals within ~6 minutes.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: signal-scan
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state (cooldowns, history, dashboard data)
        uses: actions/cache@v4
        with:
          path: |
            state.json
            signals.log
            dashboard/data.json
          key: scan-state-${{ github.run_id }}
          restore-keys: scan-state-

      - name: One full scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Cloud copy of the desktop app's Settings (app_settings.json
          # is intentionally NOT committed) - keep these in sync:
          MIN_GRADE: "B"
          STRONG_ONLY: "1"
          PROB_MIN: "0.4"
        run: python gh_runner.py

      - name: Publish dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to Pages
        id: deploy
        continue-on-error: true   # never fail a scan over a Pages hiccup
        uses: actions/deploy-pages@v4
